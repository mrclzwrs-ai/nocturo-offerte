{% extends "base.html" %}
{% block title %}Nocturo · {{ K('faq') }}{% endblock %}
{% block content %}
<p><a href="/kantoor">{{ K('back_office') }}</a></p>
<div class="kt-kop"><div><h2>Nocturo</h2><h1>{{ K('faq_titel') }}</h1></div></div>
<section class="paneel faq">
  {% for v in vragen %}
  <details><summary>{{ v[0] }}</summary><p>{{ v[1] }}</p></details>
  {% endfor %}
  <p class="hint">{{ K('faq_meer') }} <a href="mailto:info@nocturoapps.com">info@nocturoapps.com</a></p>
</section>
{% endblock %}
