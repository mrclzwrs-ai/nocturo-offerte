{% extends "base.html" %}
{% block content %}
<div class="inlog">
  <div class="logo"><img src="/static/uil.png" alt=""><b>NOCTURO</b><span>{{ T('app_name')|upper }}</span></div>
  <p class="tag">{{ T('tagline') }}</p>
  <div class="paneel">
    {% if error %}<div class="melding fout">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="veld"><label>{{ T('email') }}</label><input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required></div>
      <div class="veld"><label>{{ T('password') }}</label><input type="password" name="password" autocomplete="current-password" required></div>
      <button class="knop groot" style="width:100%">{{ T('login') }}</button>
    </form>
  </div>
  <a class="knop lijn" style="width:100%" href="/demo">{{ T('try_demo') }}</a>
  <p class="of">{{ T('no_account') }} <a href="/aanmelden">{{ T('start_trial') }}</a></p>
  <p class="of">{% for l in langs %}<a href="/taal/{{ l }}" style="margin:0 6px;{{ 'color:var(--tekst)' if l == lang }}">{{ l|upper }}</a>{% endfor %}</p>
</div>
{% endblock %}
